<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>胖啾代購｜日本連線商品目錄</title>
  
  <meta name="description" content="胖啾代購日本連線商品目錄，即時掌握官方發售日程與最新預約。">
  <meta property="og:title" content="胖啾代購｜日本連線商品目錄">
  <meta property="og:description" content="即時同步日本官方連線預購與現貨商品">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1a-i8ddYbEUd8508IIFPbsSNNiYcFdFue">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #faf6f2;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxltHUkooVMwTQxfLsHprPm4kvu_gV1K2Ofg24HXg9EHcrxTT4SMwhfO6Hcdh7IEKQX/exec"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    var frame = document.getElementById('appFrame');
    var baseGAS = "https://script.google.com/macros/s/AKfycbxltHUkooVMwTQxfLsHprPm4kvu_gV1K2Ofg24HXg9EHcrxTT4SMwhfO6Hcdh7IEKQX/exec";

    // 1. 解析目前網址列的參數物件
    function getUrlParams() {
      var params = {};
      var search = window.location.search;
      if (search) {
        var sp = new URLSearchParams(search);
        sp.forEach(function(val, key) {
          params[key] = val;
        });
      }
      return params;
    }

    // 2. 當頁面載入時，如果網址列有參數（例如 ?char=米奇好朋友），直接透傳給 iframe
    var initialSearch = window.location.search;
    if (initialSearch) {
      frame.src = baseGAS + initialSearch;
    }

    // 當 iframe 載入完成後，主動發送一次當前外層參數以確保內層執行篩選
    frame.addEventListener('load', function() {
      var params = getUrlParams();
      if (Object.keys(params).length > 0) {
        frame.contentWindow.postMessage({
          type: 'APPLY_PARAMS',
          params: params
        }, '*');
      }
    });

    // 3. 雙向同步：當內層更動分類、角色、主題或搜尋時，無刷新即時更新最上方 GitHub 網址列！
    window.addEventListener('message', function(event) {
      if (!event.data || typeof event.data !== 'object') return;
      if (event.data.type === 'SYNC_URL') {
        var newSearch = event.data.query ? ('?' + event.data.query) : '';
        var newUrl = window.location.pathname + newSearch;
        window.history.replaceState(null, '', newUrl);
      }
    });
  </script>
</body>
</html>
