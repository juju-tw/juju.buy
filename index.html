<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>胖啾代購｜日本連線商品目錄</title>
  
  <meta name="description" content="胖啾代購日本連線商品目錄，即時掌握官方發售日程與最新預約。">
  <meta property="og:title" content="胖啾代購｜日本連線商品目錄">
  <meta property="og:description" content="即時同步日本官方連線預購與現貨商品">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1a-i8ddYbEUd8508IIFPbsSNNiYcFdFue">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #faf6f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="appFrame"
    src="about:blank"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    var baseGAS = "https://script.google.com/macros/s/AKfycbxltHUkooVMwTQxfLsHprPm4kvu_gV1K2Ofg24HXg9EHcrxTT4SMwhfO6Hcdh7IEKQX/exec";
    var frame = document.getElementById('appFrame');

    // 取得當前網址的所有參數（例如 ?char=小熊維尼 或 ?p=2026聖誕節_維尼吊飾）
    var currentQuery = window.location.search || '';
    var currentHash = window.location.hash || '';

    // 將外部 GitHub 網址帶進來的參數直接傳遞給 GAS 核心
    var targetUrl = baseGAS;
    if (currentQuery) {
      targetUrl += currentQuery;
    } else if (currentHash) {
      targetUrl += '?' + currentHash.replace(/^#/, '');
    }

    frame.src = targetUrl;

    // 監聽來自內層的網址同步請求
    window.addEventListener('message', function(e) {
      try {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'SYNC_URL') {
          var query = e.data.query ? ('?' + e.data.query) : '';
          var newUrl = window.location.pathname + query;
          window.history.replaceState(null, '', newUrl);
        }
      } catch(err) {}
    });
  </script>
</body>
</html>
