<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>胖啾代購｜日本連線商品目錄</title>
  
  <meta name="description" content="胖啾代購日本連線商品目錄，即時掌握官方發售日程與最新預約。">
  <meta property="og:title" content="胖啾代購｜日本連線商品目錄">
  <meta property="og:description" content="即時同步日本官方連線預購與現貨商品">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1a-i8ddYbEUd8508IIFPbsSNNiYcFdFue">

  <script>
    // 1. 偵測是否在 Instagram / FB / LINE 等社群內建瀏覽器 (In-App Browser)
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isInstagram = (ua.indexOf('Instagram') > -1);
    var isFB = (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1);

    var baseGAS = "https://script.google.com/macros/s/AKfycbxltHUkooVMwTQxfLsHprPm4kvu_gV1K2Ofg24HXg9EHcrxTT4SMwhfO6Hcdh7IEKQX/exec";
    var query = window.location.search || '';
    if (!query && window.location.hash && window.location.hash.indexOf('?') !== -1) {
      query = window.location.hash.substring(window.location.hash.indexOf('?'));
    }

    // 若在 IG / FB 內建瀏覽器中，Meta 會徹底阻擋 iframe 內跨域載入 Google 程式
    // 因此在 IG 內直接無縫轉向至 Google 原生端，100% 保證商品正常秒開！
    if (isInstagram || isFB) {
      window.location.replace(baseGAS + query);
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #faf6f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 移除易被社群瀏覽器限制的 sandbox 屬性，賦予全功能權限 -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxltHUkooVMwTQxfLsHprPm4kvu_gV1K2Ofg24HXg9EHcrxTT4SMwhfO6Hcdh7IEKQX/exec"
    allow="clipboard-read; clipboard-write; fullscreen"
  ></iframe>

  <script>
    var frame = document.getElementById('appFrame');

    try {
      if (query) {
        frame.src = baseGAS + query;
      }
    } catch(e) {}

    // 監聽內層網址同步請求
    window.addEventListener('message', function(e) {
      try {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'SYNC_URL') {
          var q = e.data.query ? ('?' + e.data.query) : '';
          var newUrl = window.location.pathname + q;
          window.history.replaceState(null, '', newUrl);
        }
      } catch(err) {}
    });
  </script>
</body>
</html>
