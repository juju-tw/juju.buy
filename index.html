<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胖啾代購｜日本連線商品目錄</title>
  <meta name="referrer" content="no-referrer">
  <style>
    :root {
      --primary: #6b3e26;
      --primary-hover: #54301d;
      --bg: #faf6f2;
      --card-bg: #ffffff;
      --border: #ebdcd0;
      --text-main: #3d2c24;
      --text-muted: #8c786c;
      --accent: #d97736;
      --accent-sale: #c2410c;
      --line-green: #06c755;
      --line-green-hover: #05aa49;
      --badge-pre: #fdf5ea;
      --badge-pre-text: #b26b21;
      --badge-spot: #eef7ee;
      --badge-spot-text: #2f7d32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif;
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 28px 20px 22px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(107, 62, 38, 0.04);
    }

    .brand-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .brand-logo-img {
      max-height: 85px;
      max-width: 190px;
      object-fit: contain;
      border-radius: 12px;
    }

    .site-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .social-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 1px 3px rgba(107, 62, 38, 0.06);
    }

    .social-btn:hover {
      transform: translateY(-2px);
    }

    .social-btn.ig:hover {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      color: #ffffff;
      border-color: transparent;
    }

    .social-btn.threads:hover {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    .line-info-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .line-badge {
      background: #e8f8ee;
      color: #0f863e;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 16px;
      letter-spacing: 0.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .line-badge:hover {
      background: #d4f3dd;
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(15, 134, 62, 0.15);
    }

    .preorder-notice {
      display: inline-block;
      font-size: 0.82rem;
      color: #94532b;
      background: #fbf3ea;
      padding: 5px 14px;
      border-radius: 12px;
      border: 1px dashed #e6c5af;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    /* 釘選吸頂外框容器 */
    .sticky-filter-wrapper {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg);
      padding-top: 10px;
      padding-bottom: 8px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px -4px rgba(107, 62, 38, 0.06);
    }

    .filter-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 3px 12px rgba(107, 62, 38, 0.03);
    }

    .search-box {
      position: relative;
      margin-bottom: 8px;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px 8px 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
      color: var(--text-main);
      transition: border-color 0.2s, background 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .dropdown-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }

    .select-wrap select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 0.85rem;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .select-wrap select:focus {
      border-color: var(--primary);
    }

    .ip-capsules {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .capsule {
      padding: 6px 14px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid var(--border);
      font-size: 0.84rem;
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
      user-select: none;
    }

    .capsule:hover {
      background: #f4eae1;
    }

    .capsule.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(107, 62, 38, 0.25);
    }

    .results-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(107, 62, 38, 0.08);
      border-color: #d6bead;
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid #f2e7de;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
      transition: transform 0.3s;
    }

    .product-card:hover .card-img {
      transform: scale(1.03);
    }

    /* 頂部標籤群組：水平橫向並列 */
    .badge-group-left {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 2;
    }

    .badge-status {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-preorder {
      background: var(--badge-pre);
      color: var(--badge-pre-text);
      border: 1px solid #f2d4b2;
    }

    .status-instock {
      background: var(--badge-spot);
      color: var(--badge-spot-text);
      border: 1px solid #bce1bd;
    }

    /* 啾編推薦標籤 */
    .badge-featured {
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      background: #fbf3ea;
      color: #94532b;
      border: 1px solid #e6c5af;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* 促銷特價標籤：與貨況標籤橫向並列 */
    .badge-sale {
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      background: #fff1eb;
      color: var(--accent-sale);
      border: 1px solid #fed7aa;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .badge-release-date {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(84, 48, 29, 0.78);
      color: #ffffff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    .badge-multi-images {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 3px;
      z-index: 2;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-main);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-price-row {
      margin-top: auto;
      border-top: 1px dashed #ebdcd0;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    /* 原價與特價排版 */
    .card-prices-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .card-original-price {
      font-size: 0.82rem;
      color: #a89a90;
      text-decoration: line-through;
    }

    .card-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .card-price.is-sale {
      color: var(--accent-sale);
    }

    .card-price-note {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 彈窗 Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(50, 30, 20, 0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
      transform: translateY(20px) scale(0.97);
      transition: transform 0.25s ease;
      position: relative;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      background: #f2e7de;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--primary);
      z-index: 10;
    }

    .modal-gallery-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-main-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .gallery-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      z-index: 5;
    }

    .gallery-nav-btn.prev { left: 10px; }
    .gallery-nav-btn.next { right: 10px; }

    .gallery-counter {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 12px;
      z-index: 5;
    }

    .modal-thumbnails {
      display: flex;
      gap: 8px;
      padding: 10px 18px 0;
      overflow-x: auto;
    }

    .thumb-img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 2px solid transparent;
      object-fit: contain;
      cursor: pointer;
      background: #faf6f2;
      flex-shrink: 0;
    }

    .thumb-img.active {
      border-color: var(--primary);
    }

    .modal-body {
      padding: 18px 22px 24px;
    }

    /* 彈窗標籤列：只保留商品分類與角色人物 */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tag-item {
      font-size: 0.72rem;
      background: #f7ede3;
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .tag-item.category {
      background: #e6f0fa;
      color: #2b5c8f;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 8px 0;
      line-height: 1.35;
    }

    .modal-price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .modal-original-price {
      font-size: 0.95rem;
      color: #a89a90;
      text-decoration: line-through;
    }

    .modal-price {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--accent);
    }

    .modal-price.is-sale {
      color: var(--accent-sale);
    }

    .modal-desc-card {
      background: #fefbf8;
      border: 1px dashed #dfcfc2;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .modal-desc-header {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .modal-desc-content {
      font-size: 0.88rem;
      line-height: 1.6;
      color: #524037;
      white-space: pre-wrap;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .btn-myship {
      background: #e65c00;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(230, 92, 0, 0.25);
    }

    .btn-line {
      background: var(--line-green);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.2);
    }

    .btn-line:hover {
      background: var(--line-green-hover);
      transform: translateY(-1px);
    }

    .share-row {
      display: flex;
      justify-content: center;
      margin-top: 12px;
    }

    .btn-share-pill {
      background: #fbf5fc;
      color: #7d449e;
      border: 1px solid #ebd3f5;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-family: inherit;
    }

    .pagination-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 36px;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: #fbf3ea;
      transform: translateY(-1px);
    }

    .page-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(107, 62, 38, 0.2);
    }

    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: var(--border);
    }

    .page-dots {
      color: var(--text-muted);
      font-weight: 700;
      padding: 0 4px;
    }

    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #ebdcd0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    /* 手機版排版優化：2x2 雙欄緊湊下拉選單 */
    @media (max-width: 600px) {
      .container {
        padding: 10px 10px;
      }
      .sticky-filter-wrapper {
        padding-top: 6px;
        padding-bottom: 6px;
        margin-bottom: 8px;
      }
      .filter-card {
        padding: 10px 12px;
        margin-bottom: 8px;
        border-radius: 14px;
      }
      .search-box {
        margin-bottom: 6px;
      }
      .search-input {
        padding: 6px 10px 6px 34px;
        font-size: 0.84rem;
      }
      .dropdown-group {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      .select-wrap select {
        padding: 6px 8px;
        font-size: 0.78rem;
      }
      .capsule {
        padding: 4px 10px;
        font-size: 0.78rem;
      }
      .results-count {
        margin-bottom: 10px;
        font-size: 0.78rem;
      }
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .card-body {
        padding: 8px 10px;
      }
      .card-title {
        font-size: 0.84rem;
        margin-bottom: 8px;
      }
      .card-price {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo-wrap">
      <img 
        src="https://lh3.googleusercontent.com/d/1a-i8ddYbEUd8508IIFPbsSNNiYcFdFue" 
        alt="胖啾代購 Logo" 
        class="brand-logo-img"
      >
    </div>

    <h1 class="site-title">胖啾代購｜日本連線商品</h1>

    <div class="social-links">
      <a href="https://www.instagram.com/juju.buy/" target="_blank" rel="noopener noreferrer" class="social-btn ig" title="追蹤官方 Instagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <a href="https://www.threads.com/@juju.buy" target="_blank" rel="noopener noreferrer" class="social-btn threads" title="追蹤官方 Threads">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">

  <script>
    var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxltHUkooVMwTQxfLsHprPm4kvu_gV1K2Ofg24HXg9EHcrxTT4SMwhfO6Hcdh7IEKQX/exec';
    // 若修改了 GitHub 帳號名稱，只需將此處的 julianna1004-code 換成新名稱即可
    var GITHUB_BASE_URL = 'https://julianna1004-code.github.io/juju.buy/';

    // 分享基準網址：固定使用 GitHub 專屬網址，絕不使用 Google 內部臨時沙盒域名
    function getShareBaseUrl() {
      return GITHUB_BASE_URL;
    }

    var PLACEHOLDER_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400' viewBox='0 0 400 400'><rect width='400' height='400' fill='%23faf6f2'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='16' fill='%23bcaaa4'>NO IMAGE 暫無圖片</text></svg>";

    var allProducts = [];
    var currentFilteredList = [];
    var currentProduct = null;
    var currentImgList = [];
    var currentImgIndex = 0;

    var PAGE_SIZE = 20;

    function getStoredPage() {
      try {
        var p = localStorage.getItem('juju_page') || sessionStorage.getItem('juju_page');
        var parsed = parseInt(p, 10);
        return (!isNaN(parsed) && parsed > 0) ? parsed : 1;
      } catch(e) {
        return 1;
      }
    }

    function setStoredPage(p) {
      try {
        localStorage.setItem('juju_page', String(p));
        sessionStorage.setItem('juju_page', String(p));
      } catch(e) {}
    }

    var currentPage = getStoredPage();

    var filterState = {
      ip: '',
      theme: '',
      char: '',
      category: '',
      search: '',
      sort: 'featured'
    };

    function formatPrice(val) {
      if (!val && val !== 0) return 'NT$ -';
      var num = String(val).replace(/[^0-9]/g, '');
      if (!num) return String(val).indexOf('NT$') !== -1 ? String(val) : 'NT$' + String(val);
      return 'NT$' + parseInt(num, 10).toLocaleString('en-US');
    }

    // 透過 Google Apps Script 原生 API 穿透沙盒同步瀏覽器外層真實網址，並同時通知 GitHub Pages 外層
    function syncUrlWithState() {
      var params = {};
      if (filterState.ip) params.ip = filterState.ip;
      if (filterState.category) params.category = filterState.category;
      if (filterState.theme) params.theme = filterState.theme;
      if (filterState.char) params.char = filterState.char;
      if (filterState.search) params.q = filterState.search;

      var queryString = Object.keys(params).map(function(k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }).join('&');

      // 嘗試向所有上層（包括 GitHub Pages）推播同步網址
      try {
        if (window.top && window.top !== window) {
          window.top.postMessage({ type: 'SYNC_URL', query: queryString }, '*');
        }
      } catch(e) {}

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'SYNC_URL', query: queryString }, '*');
        }
      } catch(e) {}

      // 原生 Google Apps Script 內部同步
      if (typeof google !== 'undefined' && google.script && google.script.history && google.script.history.push) {
        google.script.history.push(null, params, '');
      }
    }

    // 監聽來自外層 GitHub Pages 傳入的網址參數（當客人直接打開帶參數的 GitHub 連結時）
    window.addEventListener('message', function(event) {
      if (!event.data || typeof event.data !== 'object') return;
      if (event.data.type === 'APPLY_PARAMS') {
        applyLocationParams(event.data.params || {});
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(data) {
            document.getElementById('loading').style.display = 'none';
            allProducts = data || [];
            initApp();
          })
          .withFailureHandler(function(err) {
            document.getElementById('loading').innerHTML = '<p style="color:#b26b21;">資料載入異常，請重新整理頁面</p>';
          })
          .getSheetData();
      }
    });

    function initApp() {
      currentPage = getStoredPage();

      renderFilters();

      if (typeof google !== 'undefined' && google.script && google.script.history && google.script.history.setChangeHandler) {
        google.script.history.setChangeHandler(function(e) {
          applyLocationParams(e.location.parameter || {});
        });
      }

      checkUrlParamsAndInit();

      document.getElementById('searchInput').addEventListener('input', function(e) {
        filterState.search = e.target.value.trim().toLowerCase();
        userResetToFirstPage();
        syncUrlWithState();
      });

      document.getElementById('themeSelect').addEventListener('change', function(e) {
        filterState.theme = e.target.value;
        userResetToFirstPage();
        syncUrlWithState();
      });

      document.getElementById('charSelect').addEventListener('change', function(e) {
        filterState.char = e.target.value;
        userResetToFirstPage();
        syncUrlWithState();
      });

      document.getElementById('categorySelect').addEventListener('change', function(e) {
        filterState.category = e.target.value;
        userResetToFirstPage();
        syncUrlWithState();
      });

      document.getElementById('sortSelect').addEventListener('change', function(e) {
        filterState.sort = e.target.value;
        userResetToFirstPage();
      });

      checkAndOpenTargetProduct();
    }

    function checkUrlParamsAndInit() {
      if (typeof google !== 'undefined' && google.script && google.script.url && google.script.url.getLocation) {
        google.script.url.getLocation(function(loc) {
          applyLocationParams(loc.parameter || {});
        });
      } else {
        var params = new URLSearchParams(window.location.search);
        var pObj = {};
        params.forEach(function(val, key) { pObj[key] = val; });
        applyLocationParams(pObj);
      }
    }

    function applyLocationParams(params) {
      if (params.ip) {
        filterState.ip = decodeURIComponent(params.ip).trim();
        document.querySelectorAll('.capsule').forEach(function(c) {
          if (c.getAttribute('data-ip') === filterState.ip) {
            c.classList.add('active');
          } else {
            c.classList.remove('active');
          }
        });
      }
      if (params.category) {
        filterState.category = decodeURIComponent(params.category).trim();
        var catSelect = document.getElementById('categorySelect');
        if (catSelect) catSelect.value = filterState.category;
      }
      if (params.theme) {
        filterState.theme = decodeURIComponent(params.theme).trim();
        var themeSelect = document.getElementById('themeSelect');
        if (themeSelect) themeSelect.value = filterState.theme;
      }
      if (params.char) {
        filterState.char = decodeURIComponent(params.char).trim();
        var charSelect = document.getElementById('charSelect');
        if (charSelect) charSelect.value = filterState.char;
      }
      if (params.q) {
        filterState.search = decodeURIComponent(params.q).trim().toLowerCase();
        var searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = filterState.search;
      }

      applyFilters();
    }

    function userResetToFirstPage() {
      currentPage = 1;
      setStoredPage(1);
      applyFilters();
    }

    function checkAndOpenTargetProduct() {
      if (!allProducts || allProducts.length === 0) return;

      if (typeof google !== 'undefined' && google.script && google.script.url && google.script.url.getLocation) {
        google.script.url.getLocation(function(loc) {
          var target = '';
          if (loc.hash) {
            target = loc.hash;
          } else if (loc.parameter && loc.parameter.p) {
            target = loc.parameter.p;
          }
          triggerAutoOpen(target);
        });
      } else {
        var hash = window.location.hash ? window.location.hash.substring(1) : '';
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p') || '';
        triggerAutoOpen(hash || p);
      }
    }

    function triggerAutoOpen(targetStr) {
      if (!targetStr) return;
      try {
        targetStr = decodeURIComponent(targetStr).trim();
      } catch(e) {}

      if (targetStr.startsWith('#')) targetStr = targetStr.substring(1);

      var matched = allProducts.find(function(item) {
        if (!item.name) return false;
        var itemName = item.name.trim();
        return itemName === targetStr || targetStr.includes(itemName) || itemName.includes(targetStr);
      });

      if (matched) {
        setTimeout(function() {
          openModal(matched);
        }, 150);
      }
    }

    function renderFilters() {
      var ips = {};
      var themes = {};
      var chars = {};
      var categories = {};

      allProducts.forEach(function(item) {
        if (item.ip) ips[item.ip] = true;
        if (item.theme) themes[item.theme] = true;
        if (item.character) chars[item.character] = true;
        if (item.category) categories[item.category] = true;
      });

      var capsuleContainer = document.getElementById('ipCapsules');
      capsuleContainer.innerHTML = '';

      var allDiv = document.createElement('div');
      allDiv.className = 'capsule active';
      allDiv.setAttribute('data-ip', '');
      allDiv.textContent = '全部作品';
      allDiv.onclick = function() {
        document.querySelectorAll('.capsule').forEach(function(c) { c.classList.remove('active'); });
        allDiv.classList.add('active');
        filterState.ip = '';
        userResetToFirstPage();
        syncUrlWithState();
      };
      capsuleContainer.appendChild(allDiv);

      Object.keys(ips).forEach(function(ip) {
        var cleanIP = ip.replace(/\(\d+\)/g, '').trim();
        var div = document.createElement('div');
        div.className = 'capsule';
        div.setAttribute('data-ip', ip);
        div.textContent = cleanIP;
        div.onclick = function() {
          document.querySelectorAll('.capsule').forEach(function(c) { c.classList.remove('active'); });
          div.classList.add('active');
          filterState.ip = ip;
          userResetToFirstPage();
          syncUrlWithState();
        };
        capsuleContainer.appendChild(div);
      });

      var themeSelect = document.getElementById('themeSelect');
      themeSelect.innerHTML = '<option value="">全部主題</option>';
      Object.keys(themes).forEach(function(theme) {
        var opt = document.createElement('option');
        opt.value = theme;
        opt.textContent = theme;
        themeSelect.appendChild(opt);
      });

      var charSelect = document.getElementById('charSelect');
      charSelect.innerHTML = '<option value="">全部角色</option>';
      Object.keys(chars).forEach(function(ch) {
        var opt = document.createElement('option');
        opt.value = ch;
        opt.textContent = ch;
        charSelect.appendChild(opt);
      });

      var catSelect = document.getElementById('categorySelect');
      catSelect.innerHTML = '<option value="">全商品分類</option>';
      Object.keys(categories).forEach(function(cat) {
        var opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });
    }

    function applyFilters() {
      var filtered = allProducts.filter(function(item) {
        if (filterState.ip && item.ip !== filterState.ip) return false;
        if (filterState.theme && item.theme !== filterState.theme) return false;
        if (filterState.char && item.character !== filterState.char) return false;
        if (filterState.category && item.category !== filterState.category) return false;

        if (filterState.search) {
          var s = filterState.search;
          var inName = (item.name || '').toLowerCase().indexOf(s) !== -1;
          var inTheme = (item.theme || '').toLowerCase().indexOf(s) !== -1;
          var inChar = (item.character || '').toLowerCase().indexOf(s) !== -1;
          var inCat = (item.category || '').toLowerCase().indexOf(s) !== -1;
          if (!inName && !inTheme && !inChar && !inCat) return false;
        }
        return true;
      });

      filtered.sort(function(a, b) {
        if (filterState.sort === 'featured') {
          // 🌟 啾編推薦：依 M 欄數字 1, 2, 3 由小到大排序置頂
          var fa = (a.featured !== undefined && a.featured !== '') ? String(a.featured).trim() : '';
          var fb = (b.featured !== undefined && b.featured !== '') ? String(b.featured).trim() : '';
          var isFa = fa !== '';
          var isFb = fb !== '';

          if (isFa && !isFb) return -1;
          if (!isFa && isFb) return 1;

          if (isFa && isFb) {
            var numA = parseInt(fa.replace(/[^0-9]/g, ''), 10);
            var numB = parseInt(fb.replace(/[^0-9]/g, ''), 10);
            if (!isNaN(numA) && !isNaN(numB)) {
              if (numA !== numB) return numA - numB;
            } else if (!isNaN(numA)) {
              return -1;
            } else if (!isNaN(numB)) {
              return 1;
            }
          }
          return (b.rowId || 0) - (a.rowId || 0);
        } else if (filterState.sort === 'latest') {
          // 最新上架：依表單填寫順序（越晚新增越前）
          return (b.rowId || 0) - (a.rowId || 0);
        } else if (filterState.sort === 'release-asc') {
          // 上市日期早到晚：沒填發售日視為最早排最前
          var da = a.releaseDate || '0000-00-00';
          var db = b.releaseDate || '0000-00-00';
          var dateDiff = da.localeCompare(db);
          if (dateDiff !== 0) return dateDiff;
          return (b.rowId || 0) - (a.rowId || 0);
        } else if (filterState.sort === 'release-desc') {
          // 上市日期晚到早：沒填發售日視為最晚排最後
          var da = a.releaseDate || '0000-00-00';
          var db = b.releaseDate || '0000-00-00';
          var dateDiff = db.localeCompare(da);
          if (dateDiff !== 0) return dateDiff;
          return (b.rowId || 0) - (a.rowId || 0);
        } else if (filterState.sort === 'price-asc') {
          var pa = parseInt(String(a.price).replace(/[^0-9]/g, '') || 0, 10);
          var pb = parseInt(String(b.price).replace(/[^0-9]/g, '') || 0, 10);
          return pa - pb;
        } else if (filterState.sort === 'price-desc') {
          var pa = parseInt(String(a.price).replace(/[^0-9]/g, '') || 0, 10);
          var pb = parseInt(String(b.price).replace(/[^0-9]/g, '') || 0, 10);
          return pb - pa;
        }
        return 0;
      });

      currentFilteredList = filtered;
      renderCurrentPage();
    }

    function renderCurrentPage() {
      var total = currentFilteredList.length;
      var totalPages = Math.ceil(total / PAGE_SIZE) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      setStoredPage(currentPage);

      var startIdx = (currentPage - 1) * PAGE_SIZE;
      var endIdx = startIdx + PAGE_SIZE;
      var pageItems = currentFilteredList.slice(startIdx, endIdx);

      renderProducts(pageItems, total, totalPages);
      renderPagination(totalPages);
    }

    function renderProducts(list, totalCount, totalPages) {
      var grid = document.getElementById('productGrid');
      var countText = document.getElementById('resultCountText');
      countText.textContent = '共 ' + totalCount + ' 件連線商品（第 ' + currentPage + ' / ' + totalPages + ' 頁）';

      if (totalCount === 0) {
        grid.innerHTML = '<div class="empty-state"><p>沒有找到符合條件的商品 (｡•́︿•̀｡)</p></div>';
        return;
      }

      var html = '';
      list.forEach(function(item, idx) {
        var images = item.images && item.images.length > 0 ? item.images : [PLACEHOLDER_SVG];
        var coverImg = images[0];
        var isPre = item.status && item.status.indexOf('預購') !== -1;
        var statusClass = isPre ? 'status-preorder' : 'status-instock';
        var statusLabel = item.status || '預購中';

        var hasOrig = item.originalPrice !== undefined && item.originalPrice !== '' && item.originalPrice !== null;
        var isFeatured = item.featured !== undefined && item.featured !== '' && item.featured !== null;

        html += '<div class="product-card" onclick="openModalByIdx(' + idx + ')">' +
          '<div class="card-img-wrap">' +
            '<div class="badge-group-left">' +
              '<span class="badge-status ' + statusClass + '">' + statusLabel + '</span>' +
              (isFeatured ? '<span class="badge-featured">★ 推薦</span>' : '') +
              (hasOrig ? '<span class="badge-sale">SALE 特價</span>' : '') +
            '</div>' +
            (images.length > 1 ? '<span class="badge-multi-images"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>' + images.length + '</span>' : '') +
            '<img src="' + coverImg + '" alt="' + item.name + '" class="card-img" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER_SVG + '\'">' +
            (item.releaseDate ? '<span class="badge-release-date">' + item.releaseDate + ' 上市</span>' : '') +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-title">' + item.name + '</div>' +
            '<div class="card-price-row">' +
              '<div class="card-prices-wrap">' +
                (hasOrig ? '<span class="card-original-price">' + formatPrice(item.originalPrice) + '</span>' : '') +
                '<span class="card-price ' + (hasOrig ? 'is-sale' : '') + '">' + formatPrice(item.price) + '</span>' +
              '</div>' +
              '<span class="card-price-note">(不含台灣國內運費)</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      });

      grid.innerHTML = html;
      window.lastRenderedList = list;
    }

    function renderPagination(totalPages) {
      var wrap = document.getElementById('paginationWrap');
      if (totalPages <= 1) {
        wrap.innerHTML = '';
        return;
      }

      var html = '';

      html += '<button class="page-btn" ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage - 1) + ')">〈 上一頁</button>';

      for (var p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || (p >= currentPage - 1 && p <= currentPage + 1)) {
          html += '<button class="page-btn ' + (p === currentPage ? 'active' : '') + '" onclick="goToPage(' + p + ')">' + p + '</button>';
        } else if (p === currentPage - 2 || p === currentPage + 2) {
          html += '<span class="page-dots">...</span>';
        }
      }

      html += '<button class="page-btn" ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage + 1) + ')">下一頁 〉</button>';

      wrap.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      setStoredPage(page);
      renderCurrentPage();

      // 手機版與電腦版在 GAS iframe 內的萬用穿透回頂端
      setTimeout(function() {
        var anchor = document.getElementById('topScrollAnchor');
        if (anchor) {
          try {
            anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } catch(e) {
            anchor.scrollIntoView(true);
          }
        }
        
        // 雙重保險：針對部分手機系統與 iframe 強制定位
        try {
          var yOffset = -20;
          var y = anchor ? (anchor.getBoundingClientRect().top + window.pageYOffset + yOffset) : 0;
          window.scrollTo({ top: y, behavior: 'smooth' });
        } catch(err) {
          if (anchor) anchor.scrollIntoView();
        }
      }, 30);
    }

    function openModalByIdx(idx) {
      if (window.lastRenderedList && window.lastRenderedList[idx]) {
        openModal(window.lastRenderedList[idx]);
      }
    }

    function openModal(item) {
      currentProduct = item;
      currentImgList = item.images && item.images.length > 0 ? item.images : [PLACEHOLDER_SVG];
      currentImgIndex = 0;

      updateGalleryView();

      var tagsHtml = '';
      if (item.category) tagsHtml += '<span class="tag-item category">' + item.category + '</span>';
      if (item.character) tagsHtml += '<span class="tag-item">' + item.character + '</span>';
      document.getElementById('modalTags').innerHTML = tagsHtml;

      document.getElementById('modalTitle').textContent = item.name;

      var hasOrig = item.originalPrice !== undefined && item.originalPrice !== '' && item.originalPrice !== null;
      var origEl = document.getElementById('modalOriginalPrice');
      var priceEl = document.getElementById('modalPrice');

      if (hasOrig) {
        origEl.style.display = 'inline';
        origEl.textContent = formatPrice(item.originalPrice);
        priceEl.classList.add('is-sale');
      } else {
        origEl.style.display = 'none';
        priceEl.classList.remove('is-sale');
      }
      priceEl.textContent = formatPrice(item.price);

      var descCard = document.getElementById('modalDescCard');
      var descText = document.getElementById('modalDescText');
      if (item.detail && item.detail.trim()) {
        descCard.style.display = 'block';
        descText.textContent = item.detail.trim();
      } else {
        descCard.style.display = 'none';
      }

      var myshipBtn = document.getElementById('modalMyshipBtn');
      if (item.myshipUrl && item.myshipUrl.trim().startsWith('http')) {
        myshipBtn.style.display = 'flex';
        myshipBtn.href = item.myshipUrl.trim();
      } else {
        myshipBtn.style.display = 'none';
      }

      var shareBtn = document.getElementById('shareBtn');
      if (shareBtn) {
        shareBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg> <span>分享</span>';
      }

      document.getElementById('productModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e) e.stopPropagation();
      document.getElementById('productModal').classList.remove('active');
      document.body.style.overflow = '';
      currentProduct = null;
    }

    function updateGalleryView() {
      var mainImg = document.getElementById('modalMainImg');
      var prevBtn = document.getElementById('galleryPrevBtn');
      var nextBtn = document.getElementById('galleryNextBtn');
      var counter = document.getElementById('galleryCounter');
      var thumbContainer = document.getElementById('modalThumbnails');

      mainImg.src = currentImgList[currentImgIndex];

      if (currentImgList.length > 1) {
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
        counter.style.display = 'block';
        counter.textContent = (currentImgIndex + 1) + '/' + currentImgList.length;

        var thumbHtml = '';
        currentImgList.forEach(function(url, idx) {
          thumbHtml += '<img src="' + url + '" class="thumb-img ' + (idx === currentImgIndex ? 'active' : '') + '" onclick="selectGalleryImg(' + idx + ')" referrerpolicy="no-referrer">';
        });
        thumbContainer.style.display = 'flex';
        thumbContainer.innerHTML = thumbHtml;
      } else {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        counter.style.display = 'none';
        thumbContainer.style.display = 'none';
      }
    }

    function selectGalleryImg(idx) {
      currentImgIndex = idx;
      updateGalleryView();
    }

    function prevModalImg(e) {
      if (e) e.stopPropagation();
      currentImgIndex = (currentImgIndex - 1 + currentImgList.length) % currentImgList.length;
      updateGalleryView();
    }

    function nextModalImg(e) {
      if (e) e.stopPropagation();
      currentImgIndex = (currentImgIndex + 1) % currentImgList.length;
      updateGalleryView();
    }

    function inquireOnLine() {
      if (!currentProduct) return;
      var shareBase = getShareBaseUrl();
      var text = '您好！我想詢問預購這項日本連線商品：\n' +
        '【' + currentProduct.name + '】\n' +
        '售價：' + formatPrice(currentProduct.price) + '\n' +
        '上市時間：' + (currentProduct.releaseDate || '依官方公告') + '\n' +
        '商品連結：' + shareBase + '?p=' + encodeURIComponent(currentProduct.name);

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      }
      window.open('https://line.me/R/ti/p/@juju.buy', '_blank');
    }

    function copyShareLink(e) {
      if (e) e.stopPropagation();
      if (!currentProduct) return;

      var shareBase = getShareBaseUrl();
      var shareUrl = shareBase + '?p=' + encodeURIComponent(currentProduct.name);

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(function() {
          var btn = document.getElementById('shareBtn');
          if (btn) {
            btn.innerHTML = '<span>✅ 已複製！</span>';
            setTimeout(function() {
              btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg> <span>分享</span>';
            }, 2000);
          }
        }).catch(function() {
          prompt('請複製以下商品專屬連結：', shareUrl);
        });
      } else {
        prompt('請複製以下商品專屬連結：', shareUrl);
      }
    }
  </script>
</body>
